<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

<header>
    <h1>IPL Ticket Booking</h1>
    <p>Book Your Match Tickets</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="booking.html">Book Ticket</a>
</nav>

<main>
    <section>
        <h2>Ticket Booking Form</h2>

        <form>
            <label>Name:</label>
            <input type="text" name="name" required minlength="3" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" name="email" required placeholder="Enter your email">

            <label>Phone Number:</label>
            <input type="tel" name="phone" required pattern="[0-9]{10}" placeholder="10-digit phone number">

            <label>Select Match:</label>
            <select name="match" required>
                <option value="">Select Match</option>
                <option>RCB vs CSK</option>
                <option>MI vs KKR</option>
                <option>SRH vs RR</option>
                <option>DC vs PBKS</option>
            </select>

            <label>Stand Category:</label>
            <select name="category" required>
                <option value="">Select Category</option>
                <option>General</option>
                <option>Premium</option>
                <option>VIP</option>
            </select>

            <label>Number of Tickets:</label>
            <input type="number" name="tickets" min="1" max="10" required>

            <p>Booking Preference:</p>
            <input type="radio" name="preference" value="Online" required> Online
            <input type="radio" name="preference" value="Counter"> Counter

            <br><br>

            <button type="submit">Submit Booking</button>
            <button type="reset">Reset</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 IPL Ticket Booking Website</p>
</footer>

</body>
</html>
